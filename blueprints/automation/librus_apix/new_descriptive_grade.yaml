blueprint:
  name: HALibrus - descriptive grade notification
  description: >-
    Sends one notification for each new Librus descriptive grade of the chosen
    students. One poll can bring several grades: the automation runs in queued
    mode, so every grade gets its own notification.


    The texts can use `{{ student }}` and `{{ event.<field> }}`.
    Fields: `id`, `subject`, `semester`, `grade`, `date`, `teacher`, `content`,
    `description`, `config_entry_id`.
  domain: automation
  author: Tomasz Mańkowski
  source_url: https://github.com/Tomasz-Mankowski/librus-apix-homeassistant/blob/master/blueprints/automation/librus_apix/new_descriptive_grade.yaml
  homeassistant:
    min_version: "2026.3.0"
  input:
    source:
      name: Students
      icon: mdi:account-school
      input:
        event_entities:
          name: Descriptive grades event entities
          description: The "Descriptive grades" event entity of each student (one per Librus entry).
          selector:
            entity:
              multiple: true
              filter:
                - integration: librus_apix
                  domain: event
    texts:
      name: Notification text
      icon: mdi:text
      collapsed: true
      input:
        title:
          name: Title
          default: "{{ student }}: ocena opisowa – {{ event.subject }}"
          selector:
            text: {}
        message:
          name: Message
          default: "{{ [event.get('grade'), event.get('content')] | select | join(': ') }}"
          selector:
            text:
              multiline: true
    delivery:
      name: Delivery
      icon: mdi:bell-ring
      input:
        persistent:
          name: Home Assistant notification
          description: Show the notification in the Home Assistant notification panel.
          default: true
          selector:
            boolean: {}
        notify_targets:
          name: Notify entities
          description: Optional notify entities that also get the notification.
          default: {}
          selector:
            target:
              entity:
                domain: notify
        extra_actions:
          name: Other actions
          description: >-
            Optional actions for each grade, for example a mobile app
            notification. Variables: title, message, student, event.
          default: []
          selector:
            action: {}

mode: queued
max: 50

triggers:
  # No from/to: two events within one millisecond differ only in attributes.
  - trigger: state
    entity_id: !input event_entities

variables:
  event: "{{ trigger.to_state.attributes if trigger.to_state else {} }}"
  student: "{{ event.get('student', '') }}"
  persistent: !input persistent
  notify_targets: !input notify_targets

conditions:
  # A new descriptive grade only: not a restored state after a restart or reload.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state is not none
         and trigger.to_state.state not in ['unavailable', 'unknown']
         and event.get('event_type') == 'new_descriptive_grade' }}

actions:
  # The texts are rendered here, after the condition, so a restored state
  # without event fields never renders them.
  - variables:
      title: !input title
      message: !input message
  - if:
      - condition: template
        value_template: "{{ persistent }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - if:
      - condition: template
        value_template: "{{ notify_targets.values() | select | list | count > 0 }}"
    then:
      - action: notify.send_message
        target: !input notify_targets
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - choose: []
    default: !input extra_actions
