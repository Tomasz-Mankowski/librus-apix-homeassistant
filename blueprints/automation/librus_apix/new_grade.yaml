blueprint:
  name: Librus APIX - grade notification
  description: >-
    Sends one notification for each new, corrected or changed Librus grade and
    for each semester or year grade (also proposed ones) of the chosen students.
    One poll can bring several grades: the automation runs in queued mode, so
    every grade gets its own notification.


    The texts can use `{{ student }}` and `{{ event.<field> }}`.
    Fields of `new_grade` and `grade_changed`: `id`, `subject`, `semester`,
    `grade`, `value`, `category`, `date`, `weight`, `counts`, `teacher`,
    `comment`; `new_grade` also `is_correction` and `original_grade`;
    `grade_changed` also `old_grade`. Fields of `final_grade`: `id`, `subject`,
    `period` (`semester_1`, `semester_2`, `year`), `grade`, `proposed`,
    `category`, `date`, `teacher`, `old_grade`.
  domain: automation
  author: Tomasz Mańkowski
  source_url: https://github.com/Tomasz-Mankowski/librus-apix-homeassistant/blob/master/blueprints/automation/librus_apix/new_grade.yaml
  homeassistant:
    min_version: "2026.3.0"
  input:
    source:
      name: Students
      icon: mdi:account-school
      input:
        event_entities:
          name: Grades event entities
          description: The "Grades" event entity of each student (one per Librus entry).
          selector:
            entity:
              multiple: true
              filter:
                - integration: librus_apix
                  domain: event
        event_types:
          name: Events
          default:
            - new_grade
            - grade_changed
            - final_grade
          selector:
            select:
              multiple: true
              options:
                - label: New grade (also corrections)
                  value: new_grade
                - label: Changed grade
                  value: grade_changed
                - label: Semester or year grade (also proposed)
                  value: final_grade
    texts:
      name: Notification text
      icon: mdi:text
      collapsed: true
      input:
        title:
          name: Title
          default: >-
            {{ student }}: {{ {'new_grade': 'nowa ocena', 'grade_changed':
            'zmiana oceny', 'final_grade': 'ocena okresowa'}.get(event.event_type, 'ocena') }}
            – {{ event.subject }}
          selector:
            text: {}
        message:
          name: Message
          default: >-
            {%- if event.event_type == 'grade_changed' -%}
            {{ event.old_grade }} → {{ event.grade }} ({{ event.category }})
            {%- elif event.event_type == 'final_grade' -%}
            {{ 'Proponowana ocena' if event.proposed else 'Ocena' }}
            {{ {'semester_1': 'śródroczna', 'semester_2': 'za 2. okres', 'year':
            'roczna'}.get(event.period, 'okresowa') }}: {{ event.grade }}
            {%- else -%}
            {{ event.grade }} ({{ event.category }}{{ ', waga ' ~ event.weight
            if event.get('weight') }}){{ ' – poprawa oceny ' ~
            event.original_grade.grade if event.get('is_correction') }}{{ ' – '
            ~ event.comment if event.get('comment') }}
            {%- endif -%}
          selector:
            text:
              multiline: true
    delivery:
      name: Delivery
      icon: mdi:bell-ring
      input:
        persistent:
          name: Home Assistant notification
          description: Show the notification in the Home Assistant notification panel.
          default: true
          selector:
            boolean: {}
        notify_targets:
          name: Notify entities
          description: Optional notify entities that also get the notification.
          default: {}
          selector:
            target:
              entity:
                domain: notify
        extra_actions:
          name: Other actions
          description: >-
            Optional actions for each grade, for example a mobile app
            notification. Variables: title, message, student, event.
          default: []
          selector:
            action: {}

mode: queued
max: 50

triggers:
  # No from/to: two events within one millisecond differ only in attributes.
  - trigger: state
    entity_id: !input event_entities

variables:
  event_types: !input event_types
  event: "{{ trigger.to_state.attributes if trigger.to_state else {} }}"
  student: "{{ event.get('student', '') }}"
  persistent: !input persistent
  notify_targets: !input notify_targets

conditions:
  # A new grade event only: not a restored state after a restart or reload.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state is not none
         and trigger.to_state.state not in ['unavailable', 'unknown']
         and event.get('event_type') in event_types }}

actions:
  # The texts are rendered here, after the condition, so a restored state
  # without event fields never renders them.
  - variables:
      title: !input title
      message: !input message
  - if:
      - condition: template
        value_template: "{{ persistent }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - if:
      - condition: template
        value_template: "{{ notify_targets.values() | select | list | count > 0 }}"
    then:
      - action: notify.send_message
        target: !input notify_targets
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - choose: []
    default: !input extra_actions
