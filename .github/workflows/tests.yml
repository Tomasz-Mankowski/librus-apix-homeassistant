name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The HA version pinned in requirements_test.txt runs on Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (coverage of the integration at least 90 %)
        run: pytest
      - name: Coverage of the config flow is 100 %
        run: coverage report --include="custom_components/librus_apix/config_flow.py" --fail-under=100
